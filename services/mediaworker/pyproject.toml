[project]
name = "mediaworker"
version = "0.1.0"
description = "Photu media worker: renditions, EXIF, and (from M4) face detection."
requires-python = ">=3.12,<3.13"

# Pinned to a 3.12 floor deliberately. The M4 dependency graph (onnxruntime +
# numpy + opencv + pillow-heif) publishes wheels late for a new CPython minor,
# and discovering that at model-integration time is worse than pinning now.
dependencies = [
    "boto3>=1.35",
    "insightface>=1.0.1",
    "onnxruntime>=1.28.0",
    "opencv-python-headless>=5.0.0.93",
    "pgvector>=0.5.0",
    "pillow>=11.0",
    # HEIC is the default iPhone format and Pillow cannot decode it alone. Nothing
    # on Android or in a browser renders HEIC either, which is why renditions are
    # a correctness requirement and not an optimisation.
    "pillow-heif>=0.18",
    # 3.2 is the floor: Connection.notifies() only grew `timeout`/`stop_after`
    # there, and without them LISTEN either blocks forever or has to be polled.
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
]

[project.scripts]
# Taskfile.yml invokes `uv run mediaworker --kinds=...`; `python -m mediaworker`
# reaches the same entrypoint.
mediaworker = "mediaworker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediaworker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
    # A bare `except:` swallows KeyboardInterrupt and SystemExit, which in a
    # worker means SIGTERM stops working. E722 catches the bare form; BLE001
    # flags `except Exception` so every broad catch has to justify itself with a
    # noqa and a comment.
    "BLE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test that needs Postgres or LocalStack skips with an actionable message
# rather than failing, because CI's worker lane runs Postgres but not LocalStack.
addopts = "-ra"
