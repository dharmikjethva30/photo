# photu — cross-language task runner.
#
# Task owns anything that spans languages or containers. Turborepo owns the JS
# task graph and is invoked *by* Task, so Go and Python development never depend
# on a Node install. See docs/adr/0001-monorepo-tooling.md.
#
#   task            # list everything
#   task doctor     # what's missing on this machine
#   task up         # postgres + localstack + api + workers
#   task smoke      # the end-to-end gate
version: "3"

dotenv: [".env"]

vars:
  # A physical device cannot resolve `localhost` or the compose service name
  # `localstack`. Presigned URLs must be SIGNED for the address the phone will
  # actually use, because SigV4 covers the Host header and the URL cannot be
  # rewritten afterwards. Every target that touches compose exports this.
  LAN_IP:
    sh: ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || echo 127.0.0.1
  COMPOSE: docker compose
  API_DIR: services/api
  WORKER_DIR: services/mediaworker
  AVD: photu-android-36
  ADB: '{{.ANDROID_HOME | default (printf "%s/Library/Android/sdk" (env "HOME"))}}/platform-tools/adb'

env:
  LAN_IP: "{{.LAN_IP}}"
  # React Native 0.86's Gradle requires JDK 17 specifically. Set here rather than
  # in the developer's shell profile, so a newer JDK stays the system default for
  # other work. `task doctor` reports if 17 is missing.
  JAVA_HOME:
    sh: brew --prefix openjdk@17 2>/dev/null | sed 's|$|/libexec/openjdk.jdk/Contents/Home|'
  ANDROID_HOME: '{{.ANDROID_HOME | default (printf "%s/Library/Android/sdk" (env "HOME"))}}'
  ANDROID_SDK_ROOT: '{{.ANDROID_HOME | default (printf "%s/Library/Android/sdk" (env "HOME"))}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  # ---------------------------------------------------------------- environment

  doctor:
    desc: Report what this machine is missing
    silent: true
    cmds:
      - bash scripts/doctor.sh

  lan-ip:
    desc: Print the LAN IP used for presigned URLs and PUBLIC_BASE_URL
    silent: true
    cmds:
      - |
        echo "LAN_IP={{.LAN_IP}}"
        if [ "{{.LAN_IP}}" = "127.0.0.1" ]; then
          echo "  WARNING: no LAN address found. A physical device will not be able to"
          echo "  reach the API or LocalStack. Connect to Wi-Fi and re-run."
        fi

  env:init:
    desc: Create .env from .env.example if absent
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      - echo "Created .env from .env.example — review it before running task up."

  # ------------------------------------------------------------------- compose

  up:
    desc: Start postgres, localstack, api and workers
    deps: [env:init]
    cmds:
      - "{{.COMPOSE}} up -d --build --wait"
      - task: lan-ip

  up:infra:
    desc: Start only postgres + localstack (no app code — proves the infra alone)
    deps: [env:init]
    cmds:
      - "{{.COMPOSE}} up -d --wait postgres localstack"
      - task: verify:infra

  down:
    desc: Stop everything (keeps volumes)
    cmds:
      - "{{.COMPOSE}} down"

  nuke:
    desc: Stop everything and delete volumes (full reset)
    prompt: This deletes the local database and all LocalStack objects. Continue?
    cmds:
      - "{{.COMPOSE}} down -v"

  logs:
    desc: Tail logs (task logs -- api)
    cmds:
      - "{{.COMPOSE}} logs -f --tail=100 {{.CLI_ARGS}}"

  ps:
    desc: Show compose service status
    cmds:
      - "{{.COMPOSE}} ps"

  verify:infra:
    desc: Assert postgres has pgvector and both S3 buckets exist
    silent: true
    cmds:
      - bash scripts/verify-infra.sh

  # ------------------------------------------------------------------ database

  migrate:
    desc: Apply all migrations
    cmds:
      - goose -dir {{.API_DIR}}/db/migrations postgres "$DATABASE_URL" up

  migrate:down:
    desc: Roll back one migration
    cmds:
      - goose -dir {{.API_DIR}}/db/migrations postgres "$DATABASE_URL" down

  migrate:reset:
    desc: Roll every migration back to zero, then re-apply (proves down-migrations work)
    cmds:
      - goose -dir {{.API_DIR}}/db/migrations postgres "$DATABASE_URL" down-to 0
      - goose -dir {{.API_DIR}}/db/migrations postgres "$DATABASE_URL" up

  migrate:status:
    cmds:
      - goose -dir {{.API_DIR}}/db/migrations postgres "$DATABASE_URL" status

  migrate:new:
    desc: Create a migration (task migrate:new -- add_reports_table)
    cmds:
      - goose -dir {{.API_DIR}}/db/migrations create {{.CLI_ARGS}} sql

  db:invariants:
    desc: Assert the business rules are enforced by the SCHEMA, not by Go
    cmds:
      # Each block attempts an illegal write and expects it to be rejected. Kept in
      # SQL because the subject under test is the schema: a Go test could pass while
      # the rule was actually being enforced in Go.
      - "{{.COMPOSE}} exec -T postgres psql -U $POSTGRES_USER -d $POSTGRES_DB -q -v ON_ERROR_STOP=1 < {{.API_DIR}}/db/schema_invariants_test.sql"

  psql:
    desc: Open a psql shell on the dev database
    interactive: true
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U $POSTGRES_USER -d $POSTGRES_DB"

  seed:
    desc: Seed real users and a real album through the service layer
    cmds:
      - cd {{.API_DIR}} && go run ./cmd/seed

  # ------------------------------------------------------------------ codegen

  gen:
    desc: Regenerate everything derived (OpenAPI, sqlc, tokens CSS)
    cmds:
      - task: gen:sqlc
      - task: gen:openapi
      - task: gen:tokens

  gen:sqlc:
    cmds:
      - cd {{.API_DIR}} && sqlc generate -f db/sqlc.yaml

  gen:openapi:
    cmds:
      - cd {{.API_DIR}} && go generate ./internal/httpapi/...
      - pnpm --filter @photu/api-contract run generate

  gen:tokens:
    cmds:
      - pnpm --filter @photu/tokens run build

  gen:verify:
    desc: Fail if generated output is stale (used by CI)
    cmds:
      - task: gen
      - git diff --exit-code -- '*.gen.go' 'packages/api-contract/src/generated' 'packages/tokens/dist'

  # ---------------------------------------------------------------- run: local

  api:
    desc: Run the Go API for use from the HOST (curl, task smoke)
    cmds:
      - cd {{.API_DIR}} && go run ./cmd/api

  api:emulator:
    desc: Run the Go API for use from the ANDROID EMULATOR
    env:
      # The API listens on all interfaces either way — what changes is the URLs it
      # EMITS. Image URLs in the feed and presigned S3 URLs must name a host the
      # CLIENT can reach, and inside the emulator `localhost` is the emulator
      # itself. 10.0.2.2 is its alias for this machine.
      #
      # Presigned URLs in particular cannot be rewritten after the fact: SigV4
      # covers the Host header. See docs/adr/0003.
      PUBLIC_BASE_URL: http://10.0.2.2:8080
      S3_ENDPOINT_PUBLIC: http://10.0.2.2:4566
    cmds:
      - cd {{.API_DIR}} && go run ./cmd/api

  api:device:
    desc: Run the Go API for use from a PHYSICAL DEVICE on this LAN
    env:
      PUBLIC_BASE_URL: http://{{.LAN_IP}}:8080
      S3_ENDPOINT_PUBLIC: http://{{.LAN_IP}}:4566
    cmds:
      - task: lan-ip
      - cd {{.API_DIR}} && go run ./cmd/api

  worker:
    desc: Run the Go (river) worker on the host
    cmds:
      - cd {{.API_DIR}} && go run ./cmd/worker

  mediaworker:
    desc: Run the Python media worker (thumbnails). Required for photos to become viewable.
    env:
      # The worker only ever talks to S3 server-side, so it uses the INTERNAL
      # endpoint and never presigns — the two-endpoint split in ADR 0003 does not
      # apply to it.
      S3_ENDPOINT_INTERNAL: http://localhost:4566
    cmds:
      # `face` is deliberately NOT in the list: that handler lands in M4 and would
      # pull ~300MB of ONNX weights. Face jobs stay queued until then, which is why
      # media_items.face_proc_state stays 'queued' and face-privacy albums show only
      # your own uploads for now.
      - cd {{.WORKER_DIR}} && uv run python -m mediaworker --kinds=thumbnail

  mobile:
    desc: Start Metro for the mobile app (dev client)
    cmds:
      - pnpm --filter @photu/mobile exec expo start --dev-client

  mobile:prebuild:
    desc: Regenerate ios/ and android/ from app.config.ts
    cmds:
      - pnpm --filter @photu/mobile exec expo prebuild --clean

  mobile:android:
    desc: Build, install and launch the app on the running emulator
    deps: [emulator]
    cmds:
      # No --device flag: it wants an AVD name, not an adb serial, and passing the
      # serial makes it exit 0 without installing anything.
      - pnpm --filter @photu/mobile exec expo run:android

  mobile:menu:
    desc: Open the React Native dev menu on the emulator (reload, inspector, perf)
    cmds:
      # KEYCODE_MENU. Metro fast-refreshes on save already, so this is only needed
      # for a full reload or the inspector.
      - "{{.ADB}} shell input keyevent 82"

  mobile:launch:
    desc: Launch the installed app without rebuilding
    cmds:
      # `am start` on the explicit activity. `monkey` is unreliable here — it can
      # land on the launcher instead of the app.
      - "{{.ADB}} shell am start -n app.photu.mobile/.MainActivity"

  dev:
    desc: Everything — infra, migrations, API, emulator, app
    cmds:
      - task: up:infra
      - task: migrate
      - task: emulator
      - |
        echo
        echo "Infra and emulator are up. Now run these in separate terminals:"
        echo "  task api:emulator   # the Go API, emitting URLs the emulator can reach"
        echo "  task mediaworker    # thumbnails — without it photos never become viewable"
        echo "  task mobile:android # build + install on the emulator"
        echo
        echo "See docs/running-locally.md"

  # -------------------------------------------------------------------- android

  android:setup:
    desc: Install JDK 17, Android SDK and create the AVD (idempotent, slow first run)
    cmds:
      - bash scripts/setup-android.sh

  emulator:
    desc: Boot the Android emulator in the background
    status:
      # Already booted — adb reports 1 only once the system is fully up.
      - test "$({{.ADB}} shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
    cmds:
      - |
        # -no-snapshot, not -no-snapshot-save: loading a snapshot taken under a
        # different graphics backend logs "snapshot was created with gfxstream=0,
        # but this emulator has gfxstream=1" and the AVD has died mid-session more
        # than once. A cold boot costs ~35s and is reliable.
        nohup "$ANDROID_HOME/emulator/emulator" -avd {{.AVD}} \
          -no-snapshot -no-boot-anim -gpu auto >/tmp/photu-emulator.log 2>&1 &
        printf 'waiting for boot'
        for i in $(seq 1 60); do
          if [ "$({{.ADB}} shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
            echo " — up after ~$((i*3))s"; exit 0
          fi
          printf '.'; sleep 3
        done
        echo; echo "emulator did not boot within 180s; see /tmp/photu-emulator.log"; exit 1

  emulator:stop:
    desc: Shut the emulator down
    cmds:
      - "{{.ADB}} emu kill || true"

  shot:
    desc: Screenshot the emulator (task shot -- name)
    # Single-quoted YAML so the Go template can use its own double quotes; escaping
    # them inside a double-quoted scalar reaches the template as backslashes and
    # fails with 'unexpected "\\" in operand'.
    vars:
      NAME: '{{.CLI_ARGS | default "shot"}}'
    cmds:
      - mkdir -p tmp/shots
      - '{{.ADB}} exec-out screencap -p > tmp/shots/{{.NAME}}.png'
      - 'echo "wrote tmp/shots/{{.NAME}}.png"'

  logcat:
    desc: Tail the app's logs from the emulator
    cmds:
      - "{{.ADB}} logcat --pid=$({{.ADB}} shell pidof -s app.photu.mobile)"

  web:
    desc: Start the Next.js web app
    cmds:
      - pnpm --filter @photu/web run dev

  models:fetch:
    desc: Download the InsightFace ONNX weights into the worker model cache
    cmds:
      - cd {{.WORKER_DIR}} && uv run python -m mediaworker.models fetch

  fonts:build:
    desc: Instance and subset the 10 static font faces the app bundles
    cmds:
      # uv --with keeps fontTools out of any project's dependency graph; this runs
      # rarely (only when a face is added) and is not part of the app build.
      - uv run --quiet --with fonttools --with brotli python scripts/build-fonts.py

  # -------------------------------------------------------------------- checks

  test:
    desc: Run every test suite
    cmds:
      - task: test:go
      - task: test:py
      - task: test:js

  test:go:
    cmds:
      - cd {{.API_DIR}} && go test ./... -race -count=1

  test:py:
    cmds:
      - cd {{.WORKER_DIR}} && uv run pytest -q

  test:js:
    cmds:
      - pnpm turbo run test

  lint:
    desc: Lint every language
    cmds:
      - task: lint:go
      - task: lint:py
      - task: lint:js

  lint:go:
    cmds:
      - cd {{.API_DIR}} && go vet ./...
      - cd {{.API_DIR}} && golangci-lint run

  lint:py:
    cmds:
      - cd {{.WORKER_DIR}} && uv run ruff check .
      - cd {{.WORKER_DIR}} && uv run ruff format --check .

  lint:js:
    cmds:
      - pnpm biome check .
      - pnpm turbo run typecheck

  lint:no-mocks:
    desc: Fail if prototype fixture data leaked into app code
    silent: true
    cmds:
      - bash scripts/no-mocks.sh

  smoke:
    desc: End-to-end gate — signin, create album, upload a real photo, read it back
    cmds:
      - bash scripts/smoke.sh

  # --------------------------------------------------------------------- misc

  keys:dev:
    desc: Print a dev Ed25519 signing key for JWT_PRIVATE_KEY_PEM in .env
    cmds:
      # Optional: with no key set, `task api` generates an ephemeral one at
      # startup. Set it in .env only if you want sessions to survive a restart.
      - cd {{.API_DIR}} && go run ./cmd/devkeys

  fmt:
    desc: Format everything
    cmds:
      - pnpm biome check --write .
      - cd {{.API_DIR}} && go fmt ./...
      - cd {{.WORKER_DIR}} && uv run ruff format .
