# Local development topology.
#
# M0 brings up only the two stateful dependencies, deliberately: the plan proves
# the infrastructure works before a single line of application code exists. The
# `api`, `worker`, `mediaworker-thumb` and `mediaworker-face` services are added
# in M1 once their Dockerfiles exist.
#
# Metro (the mobile bundler) always runs on the host — never containerised.
name: photu

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photu}
      POSTGRES_DB: ${POSTGRES_DB:-photu}
      # Deterministic collation, so ORDER BY does not differ between a
      # developer's machine and CI.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first init of the volume. `task nuke` deletes the volume,
      # which is what makes this re-run.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photu} -d ${POSTGRES_DB:-photu}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
      DEBUG: "0"
      # Community edition has no full persistence, so we rely on the init hook
      # re-running on every start instead of persisting bucket state.
      PERSISTENCE: "0"
      MEDIA_BUCKET: ${MEDIA_BUCKET:-photu-media-dev}
      FACEDATA_BUCKET: ${FACEDATA_BUCKET:-photu-facedata-dev}
      # LocalStack echoes this host back in some responses (e.g. multipart
      # Location). Pointing it at the LAN address keeps those usable from a
      # physical device rather than handing back an unreachable `localhost`.
      LOCALSTACK_HOST: "${LAN_IP:-localhost}:4566"
    ports:
      - "4566:4566"
    volumes:
      # The image auto-executes anything here once S3 is ready. This is why the
      # host needs neither awslocal nor the localstack CLI.
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
      - lsdata:/var/lib/localstack
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:4566/_localstack/health
          | grep -qE '"s3": *"(available|running)"'
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  lsdata:
